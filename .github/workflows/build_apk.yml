name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip openjdk-17-jdk

      - name: Install buildozer
        run: |
          pip install --user buildozer cython

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug --allow-root
        env:
          CI: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
- name: Install dependencies
  run: |
    sudo apt update
    sudo apt install -y git zip unzip openjdk-17-jdk build-essential python3-pip
    pip install --upgrade pip
    pip install cython==0.29.36 buildozer==1.5.0 kivy
