name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk build-essential python3-pip

      - name: Install Buildozer (IMPORTANT FIX)
        run: |
          pip install --upgrade pip
          pip install cython buildozer

      - name: Fix PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK (NO ROOT MODE FIX)
        run: |
          buildozer android debug
        env:
          HOME: /home/runner

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
