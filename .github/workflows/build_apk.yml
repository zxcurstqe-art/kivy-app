name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk build-essential python3-pip

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Fix permissions (IMPORTANT)
        run: |
          sudo useradd -m builder || true
          sudo chown -R builder:builder $PWD

      - name: Build APK as non-root user
        run: |
          sudo -u builder bash -c "
            cd $PWD &&
            export PATH=$PATH:~/.local/bin &&
            buildozer android debug
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
