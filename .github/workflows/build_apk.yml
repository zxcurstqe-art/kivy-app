name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать сборку вручную через интерфейс GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование вашего кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Настройка Python (не всегда обязательно, но полезно для предварительных скриптов)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Шаг 3: Сборка APK с помощью Buildozer
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      # Шаг 4: Загрузка собранного APK как артефакта (вы сможете скачать его со страницы Actions)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.buildozer.outputs.filename }}
