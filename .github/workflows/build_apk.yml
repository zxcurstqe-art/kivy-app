name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk build-essential

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer==1.5.0

      - name: Create non-root user (REAL FIX)
        run: |
          sudo useradd -m builder || true
          sudo chown -R builder:builder $GITHUB_WORKSPACE

      - name: Build APK as non-root user
        run: |
          sudo -u builder bash -c "
            cd $GITHUB_WORKSPACE &&
            export PATH=$PATH:$HOME/.local/bin &&
            buildozer android debug
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
